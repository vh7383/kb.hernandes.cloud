name: Build and deploy KB

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      # .quartz/ (résolution des plugins) régénéré à chaque run plutôt que committé
      # (pesait ~900 Mo avec l'historique git de chaque plugin).
      - name: Installer les plugins Quartz (depuis quartz.lock.json)
        run: node quartz/bootstrap-cli.mjs plugin install

      - name: Builder (Quartz)
        run: npx quartz build

      # Clé dédiée, restreinte via rrsync au seul dossier /opt/kb-hernandes-cloud/public
      # sur le Pi (NE PAS réutiliser PI_SSH_KEY, verrouillée sur deploy.sh du site).
      - name: Configurer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_KB_SSH_KEY }}

      - name: Déployer sur le Pi
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts
          # Destination vide : rrsync côté Pi préfixe déjà /opt/kb-hernandes-cloud/public.
          rsync -avzi --stats --delete -e "ssh -o StrictHostKeyChecking=no" public/ ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}: